<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="text-align:center; align-items:center;">
    <h1>Create Your Account</h1>
    <h3>Join us and get started today</h3>

    <form action="">
        <label for="fullname">Full Name</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Create a password" required><br><br>

        <label for="password">Confirm Password</label><br>
        <input type="password" id="password" name="password" placeholder="Confirm your password" required><br><br>

        <label for="gender">Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="dob">Date of Birth</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="country">Country</label><br>
        <select id="country" name="country">
            <option value="india">India</option>
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option>
        </select><br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a></label><br><br>

        <button type="submit">REGISTER NOW</button><br><br>   

        <p>Already have an account? <a href="#">Login here</a></p>

    </form>
</body>
</html>
