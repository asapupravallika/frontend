<!--
Display behaviour

Block level elements: are the elements which occupy total space and always start from a new line.
ex: heading, paragraph, list, table, form

Inline elements are the elements which occupy necessary space and does not start from a new line.
ex: span, anchor, img, input

div and span: division elements which is used to group the sections for applying styles. Block level element is div.

span: is used to group the text for applying styles. It is an inline element.

Semantics: are used to convey the meaning about the content to the browser and developer. It is used to improve the accessibility of the web page.
ex:
<header>content</header>
<nav>content</nav>
<main>content</main>
<article>content</article>
<aside>content</aside>
<footer>content</footer>

Forms: are used to collect the data from the user and allowing users to submit the data to the server for processing. It is used to create interactive web pages.
ex: sign up form, login form, feedback form, contact form, registration form
forms are defined using <form> tag.
form fields are defined using input, textarea, select, button tags.
<form>

</form>
1) type : it controls the form field behavior.

2) placeholder : it conveys the meaning about the form field.

3) for and id : it is used to form the relation between the input and label.

4) name : it will act as a key and carry the data in key and value pair to the server.

5) value : it provides the pre-defined value.

Applications:
-->
