<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /*
        relative units
        % it always depends on parent 

        viewport width - it always depends on the view port screen
        viewport height - it always depends on the view port screen

        rem - root element

        flexbox: it is used to create 1-Dimensional Layouts
        navbar, cards, sections

        It has 2 types of properties:
        Flex container property (parent)
        Flex item property (child)

        flex parent properties
        1) display:flex;
        it will change direction of flex items to single row
        it will create flex container

        2) flex-direction - it is used to change the direction of flex item
        flex-direction: row/column/row-reverse/column-reverse;

        3) justify-content: start/end/center/space-between/space-evenly/space-around; 
        it is used to control the child items in main axis

        4) align-items: 
        it is used to control the child items on cross axis

        5) flex-wrap - it is used to wrap the items into the next row
           flex-wrap:wrap;
           flex-wrap:wrap-reverse;

        6) align-content - it is used to conteol the child items on cross axis when there is more than one row
           align-content : start/end/space-between/space-evenly/space-around;

        7) flex-flow - it is a combination of flex-wrap and flex-direction
           flex-flow : wrap reverse;
           flex-flow : wrap column-reverse;


        Child Properties:
        1) flex-basis - it specifies the initial width of a child item

        */

        .parent{
            display: flex;
            justify-content: center;
            flex-wrap: wrap-reverse;
            align-content: space-evenly;
            height: 100vh;
        }

        .child{
            background-color: lightsalmon;
            padding: 20px;
            border: 2px solid;
            width: 25%;
        }
    </style>
</head>
<body>
    
    <div class="parent">
        <div class="child">child 1</div>
        <div class="child">child 2</div>
        <div class="child">child 3</div>
        <div class="child">child 4</div>
        <div class="child">child 1</div>
        <div class="child">child 2</div>
        <div class="child">child 3</div>
        <div class="child">child 4</div>
    </div>

</body>
</html>
